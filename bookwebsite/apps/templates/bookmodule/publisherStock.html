{% extends "layouts/base.html" %}

{% block title %}Publisher Stock{% endblock title %}

{% block content %}
<h1>Publisher Stock</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Publisher</th>
        <th>Total Stock</th>
    </tr>

    {% for publisher in publishers %}
    <tr>
        <td>{{ publisher.name }}</td>
        <td>{{ publisher.total_stock }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="2">No publishers found.</td>
    </tr>
    {% endfor %}
</table>
{% endblock content %}
